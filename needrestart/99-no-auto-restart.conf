# /etc/needrestart/conf.d/99-no-auto-restart.conf
#
# 禁止 needrestart 在 apt 升级后自动重启服务，只列出、不动作。
#
# 为什么需要它：
#   在 Ubuntu 上，unattended-upgrades 每日自动安装安全更新；升级完成后会通过
#   apt 的 Post-Invoke 钩子调用 needrestart。needrestart 一旦判定某服务链接了
#   刚被升级的库，就会自动 `systemctl restart <svc>`（默认模式 'a'）。
#   对 nginx 而言，这个"计划外重启"可能失败——例如宝塔的 init.d 脚本在 pid
#   文件陈旧/为空时会误判"已在运行"而拒绝启动——结果服务停摆且无人拉起。
#
#   'l' = 只列出需要重启的服务，由管理员自行决定何时重启。
#   注意：安全更新本身仍照常安装，只是不再顺带重启服务。
#
# 参考：needrestart(1)、/etc/needrestart/conf.d/README.needrestart
# 日期：2026-10-04

$nrconf{restart} = 'l';
